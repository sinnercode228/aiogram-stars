[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiogram-stars"
version = "0.1.0"
description = "Telegram Stars payments for aiogram 3: signed invoice payloads, exactly-once payment handling and a durable refund outbox"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "sinnercode228" }]
keywords = ["aiogram", "telegram", "telegram-bot", "telegram-stars", "payments", "refunds"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = ["aiogram>=3.15,<4"]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0.30,<3"]
sqlite = ["aiosqlite>=0.20"]
postgres = ["asyncpg>=0.29"]
dev = [
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "twine>=6.1",
]

[project.urls]
Homepage = "https://github.com/sinnercode228/aiogram-stars"
Source = "https://github.com/sinnercode228/aiogram-stars"
Issues = "https://github.com/sinnercode228/aiogram-stars/issues"
Changelog = "https://github.com/sinnercode228/aiogram-stars/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/aiogram_stars"]

[tool.hatch.build.targets.sdist]
include = ["src/aiogram_stars", "tests", "examples", "CHANGELOG.md", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["aiogram_stars"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF", "S", "PT", "RET", "C4", "PL",
  "D", "ANN", "TID", "T20", "LOG", "G", "DTZ", "PIE", "PERF", "FBT",
]
ignore = ["D203", "D213", "D105", "D107", "PLR0913", "FBT001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "D", "ANN401", "PLC0415", "FBT"]
"examples/**" = ["D", "S105", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src", "tests", "examples"]
