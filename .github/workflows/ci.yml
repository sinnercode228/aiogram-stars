name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev,sqlalchemy]"
      - run: ruff check
      - run: ruff format --check
      - run: mypy --strict src
      - name: mypy (tests and examples)
        run: mypy

  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.deps }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        deps: [latest]
        include:
          - python-version: "3.10"
            deps: lowest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: starslib_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STARS_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/starslib_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,sqlalchemy]"
      - name: Install the lowest supported versions
        if: matrix.deps == 'lowest'
        run: >-
          python -m pip install
          "aiogram==3.15.0" "sqlalchemy[asyncio]==2.0.30" "aiosqlite==0.20.0" "asyncpg==0.29.0"
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: coverage
          path: coverage.xml

  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
